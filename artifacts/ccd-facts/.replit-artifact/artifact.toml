kind = "web"
previewPath = "/ccd-facts/"
title = "CCD Facts"
description = "An imported standalone interactive evidence canvas for the Creative Curriculum Designer project, preserved from the requested GitHub branch and kept editable at the app root."
version = "1.0.0"
id = "artifacts/ccd-facts"
router = "path"

[[services]]
name = "web"
paths = [ "/ccd-facts/" ]
localPort = 20374

[services.development]
run = "npm run dev -- --port $PORT"

[services.production]
build = [ "npm", "run", "build" ]
serve = "static"
publicDir = "artifacts/ccd-facts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20374"
BASE_PATH = "/ccd-facts/"
