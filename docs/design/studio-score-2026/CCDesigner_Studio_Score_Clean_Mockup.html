function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monday(){const d=new Date('2026-10-12T12:00:00');d.setDate(d.getDate()+state.week*7);return d}function formatDate(d,opts){return d.toLocaleDateString('en-GB',opts)}function dateRange(){const a=monday(),b=new Date(a);b.setDate(a.getDate()+4);return `${a.getDate()}–${b.getDate()} ${formatDate(b,{month:'long',year:'numeric'})}`}
function btn(text,on,cls=''){return `<button class="btn ${cls}" data-action="${on}">${text}</button>`}
function heading(crumb,title,subtitle='',actions=''){return `<header class="topline"><div><div class="eyebrow">${crumb}</div><h1>${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:''}</div><div class="actions">${actions}</div></header>`}
function weekView(){const todayOffset=state.week===0;const daynames=['Mon','Tue','Wed','Thu','Fri'];const m=monday();const all=lessons.concat(state.extra.filter(l=>l.week===state.week));return `<div class="week-grid">${daynames.map((d,i)=>{const day=new Date(m);day.setDate(m.getDate()+i);const dayLessons=all.filter(l=>l.day===i).sort((a,b)=>a.time.localeCompare(b.time));return `<section class="day ${i===2&&todayOffset?'today':''}" aria-label="${d} ${day.getDate()}"><div class="day-head"><span class="day-num">${day.getDate()}</span><span class="day-dow">${d}</span>${i===2&&todayOffset?'<span class="todaypill">Today</span>':''}</div>${dayLessons.map(l=>`<button class="lesson-card" data-open-lesson="${l.id}"><span class="timepill ${l.tone==='purple'?'purple':l.tone==='yellow'?'yellow':''}">${escapeHTML(l.time)}</span><strong>${escapeHTML(l.who)}</strong><span class="desc">${escapeHTML(l.title)}</span></button>`).join('')}<button class="empty-slot" data-add-day="${i}" aria-label="Add lesson on ${d}">＋ Add lesson</button></section>`}).join('')}</div>`}
function otherView(){const v=state.view,m=monday();if(v==='Day'){const i=2;return `<div class="viewbox"><div class="surface"><h3>Wednesday ${new Date(m.getTime()+2*86400000).getDate()} · your teaching</h3>${lessons.filter(l=>l.day===i).map(l=>`<div class="listrow"><span class="chip">${l.time}</span><div class="listbody"><strong>${escapeHTML(l.who)}</strong><small>${escapeHTML(l.title)}</small></div>${btn('Open →','open:'+l.id,'mini')}</div>`).join('')}</div></div>`}if(v==='Month'){return `<div class="viewbox"><div class="surface"><h3>October 2026 · monthly overview</h3><p class="sub">A quieter, high-level view. Select a week to return to your five-day planner.</p><div class="grid3" style="margin-top:18px">${['Week 1','Week 2','Week 3','Week 4'].map((t,i)=>`<button class="lesson-card" data-action="monthweek:${i-1}"><span class="chip ${i===1?'yellow':''}">${t}</span><strong>${i===1?'Teaching examples':'Planning workspace'}</strong><span class="desc">View weekly plan →</span></button>`).join('')}</div></div></div>`}if(v==='Half-term'||v==='Year'){return `<div class="viewbox"><div class="surface"><h3>${v==='Half-term'?'Autumn half-term overview':'Academic year journey'}</h3><div class="grid3" style="margin-top:20px">${['Autumn 1','Autumn 2','Spring 1','Spring 2','Summer 1','Summer 2'].map((t,i)=>`<button class="lesson-card" data-action="unit:${i}"><span class="chip ${i<2?'mint':'grey'}">${t}</span><strong>${['Singing & movement','Instrumental skills','Creative performance','Drama and story','Ensemble projects','Review & celebrate'][i]}</strong><span class="desc">Open units and progression →</span></button>`).join('')}</div></div></div>`}return `<div class="viewbox"><div class="surface"><h3>Your teaching journey</h3><p class="sub">Units connect activities, lessons and teaching dates. This view is a visual design example.</p><div class="listrow"><span class="mini-bullet"></span><div class="listbody"><strong>Year 3–4 · Ukulele Karate</strong><small>Strings → C & Am → F → Ensemble → Performance</small></div>${btn('Open unit →','page:curriculum','mini')}</div><div class="progress-steps" style="margin:12px 0 20px">${[1,1,1,0,0,0].map(t=>`<div class="${t?'done':''}"></div>`).join('')}</div><div class="listrow"><span class="mini-bullet" style="background:#a99ffa"></span><div class="listbody"><strong>Reception · Robot Orchestra</strong><small>Listen → Move → Play → Explore</small></div>${btn('Open unit →','page:curriculum','mini')}</div></div></div>`}

else if(tab==='Curriculum'){content=`<h3 style="font-size:17px">Learning outcomes</h3>${l.objectives.map(x=>`<div class="listrow"><span class="chip mint">✓</span><div class="listbody"><strong>${escapeHTML(x)}</strong></div></div>`).join('')}<p class="sub">Preserve existing EYFS–KS5 curriculum mappings, school-created statements and exported outcomes.</p>`}
else{content=`<h3 style="font-size:17px">Post-lesson reflection</h3><p class="sub">Leave what worked and what to improve for next time. This example does not mark a lesson as taught.</p><div class="field" style="margin-top:20px"><label for="reflection">Your reflection</label><textarea class="input textarea" id="reflection" placeholder="What worked well? What would you adapt?"></textarea></div>${btn('Save in this demonstration','reflectsave','primary')}`}

function newLesson(day=2){state.newDay=day;openDrawer(`<div class="drawer-top"><div class="draw-heading"><div><div class="eyebrow">YOUR TEACHING SPACE</div><h2>Create a lesson</h2><p class="sub">Just the essentials to start. Add activities when you are ready.</p></div>${btn(icons.close,'close','icon')}</div></div><div class="drawer-body"><div class="field"><label for="new-who">Class or year group</label><input id="new-who" class="input" placeholder="e.g. Year 3 · Drama" /></div><div class="field"><label for="new-title">Lesson title</label><input id="new-title" class="input" placeholder="e.g. Exploring character" /></div><div class="field"><label for="new-day">Day</label><select id="new-day" class="input">${['Monday','Tuesday','Wednesday','Thursday','Friday'].map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label for="new-time">Start time</label><input id="new-time" type="time" class="input" value="11:45" /></div><div class="surface alt"><p class="sub">In the real application this must use existing lesson, schedule and timetable flows. Creating here adds an example card to this browser session only.</p></div></div><div class="drawer-foot">${btn('Create example lesson','create','primary')}</div>`)}
function polish(){const selected=findLesson(state.selected);const title=selected?selected.title:'Robot Orchestra';openModal(`<div class="modal-header"><div><div class="eyebrow"><span>✦ POLISH WITH AI</span> &nbsp; • &nbsp; DESIGN PREVIEW</div><h2 style="margin:8px 0">A thoughtful second look</h2><p class="sub">Ideas for <strong>${escapeHTML(title)}</strong> — your original stays untouched unless you accept a change.</p></div>${btn(icons.close,'close','icon')}</div><div class="modal-content"><div class="ai-card"><label class="toggle"><input type="checkbox" checked id="suggest1"><span><strong>Improve the learning sequence</strong><p>Move from a playful warm-up to practical exploration, a shared performance and a short reflection.</p></span></label></div><div class="ai-card"><label class="toggle"><input type="checkbox" checked id="suggest2"><span><strong>Make the success statements clearer</strong><p>Use concise, child-friendly “I can…” statements linked to the learning taking place.</p></span></label></div><div class="ai-card"><label class="toggle"><input type="checkbox" id="suggest3"><span><strong>Offer differentiation ideas</strong><p>Add a scaffold for new learners and a creative extension for pupils ready for more.</p></span></label></div><p class="tiny muted">This is a scripted interface demonstration, not an AI-generated response. In production, AI calls should be optional, metered and explicit.</p><div class="row" style="margin-top:18px">${btn('Keep original','close')}${btn('Accept selected suggestions','acceptpolish','primary')}</div></div>`)}
function showTool(name){state.showTools=false;render();const d={"Filter by class":"Select year groups, subjects and class context without crowding the planner. Existing class settings remain authoritative.","Timetable settings":"Keep recurring lessons, term calendars, A/B rotations and custom teaching schedules in a focused settings view.","Print / export":"Preserve all existing printing, sharing, PDF and Word capabilities and their demo restrictions.","Duplicate week":"Reuse plans safely, with clear copy/move semantics and an undo path.","Post-lesson reflections":"Review your lesson only when needed; feedback is not displayed permanently beside the timetable.","Hub management":"Keep existing Hub drafts, publisher review, access codes, role gates, reach reporting and resource access controls.","Export lesson":"Keep established Rhythmstix Word and PDF lesson templates and all existing export permissions.","New activity":"Create activity blocks through the existing Activity Library workflow.","New unit":"Create units using the existing unit, stack and curriculum links.","Unit details":"Use existing unit data, progression and linked lessons.","Forum & support":"Preserve the existing two-way teacher–provider forum.","Settings":"Retain all existing options in clearly grouped, searchable settings.","Lesson Library":"Retain saved lessons, sharing and duplication.","Assessment":"Potential future Assessify connection — concept only, not a claim of delivered functionality."};openDrawer(`<div class="drawer-top"><div class="draw-heading"><div><div class="eyebrow">ALL TOOLS</div><h2>${escapeHTML(name)}</h2></div>${btn(icons.close,'close','icon')}</div></div><div class="drawer-body"><p style="font-size:13px;line-height:1.8">${escapeHTML(d[name]||'This capability remains accessible through the relevant existing CCDesigner area. The mock-up shows where it could live.')}</p><div class="surface alt" style="margin-top:25px"><strong>Design-only panel</strong><p class="sub">The implementation must reuse real data, existing actions and permissions. No live changes have been made.</p></div></div><div class="drawer-foot">${btn('Return to workspace','close')}</div>`)}
function showSearch(){openModal(`<div class="modal-header"><div><h2>Find anything</h2><p class="sub">A single shortcut to the tools hidden behind the calm interface.</p></div>${btn(icons.close,'close','icon')}</div><div class="modal-content"><input class="input" id="cmd-input" autofocus placeholder="Search Hubs, lessons, activities, settings…"/><ul class="command-list" id="cmd-list"></ul><p class="tiny muted">Press ⌘K / Ctrl+K anywhere to open this search.</p></div>`);paintSearch('');setTimeout(()=>$('#cmd-input')?.focus(),40)}
const cmds=[['Partner Hubs','hubs'],['Week Planner','planner'],['Lesson Builder','builder'],['Activity Library','activities'],['Curriculum & Units','curriculum'],['More tools','more'],['Polish with AI','polish'],['Timetable settings','tool:Timetable settings'],['Forum & support','tool:Forum & support'],['Print / export','tool:Print / export']];
function paintSearch(q){const n=$('#cmd-list');if(!n)return;n.innerHTML=cmds.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(x=>`<li><button data-action="${x[1].includes(':')?x[1]:['polish'].includes(x[1])?'polish':'page:'+x[1]}">${x[0]} <small>↵</small></button></li>`).join('')||'<li class="muted" style="padding:14px">No matches</li>'}
function action(a){if(a==='close'){closeOverlays();return}if(a.startsWith('page:')){navigate(a.slice(5));return}if(a.startsWith('open:')){showLesson(a.slice(5));return}if(a==='polish'){polish();return}if(a==='new'){newLesson();return}if(a==='search'){showSearch();return}if(a==='thisweek'){state.week=0;state.view='Week';render();return}if(a==='prev'||a==='next'){state.week+=a==='next'?1:-1;render();return}if(a==='options'){state.showTools=!state.showTools;render();return}if(a.startsWith('monthweek:')){state.week=Number(a.split(':')[1]);state.view='Week';render();return}if(a.startsWith('unit:')){state.view='Units';render();return}if(a.startsWith('tool:')){showTool(a.slice(5));return}if(a==='hubback'){state.hubDetail=null;render();return}if(a==='acceptpolish'){const count=['suggest1','suggest2','suggest3'].filter(x=>$('#'+x)?.checked).length;state.appliedPolish=true;closeOverlays();notice(`Accepted ${count} example suggestion${count===1?'':'s'} in this design preview only`);return}if(a==='reflectsave'){closeOverlays();notice('Reflection saved in the visual demonstration only');return}if(a==='create'){const who=$('#new-who')?.value.trim(),title=$('#new-title')?.value.trim(),day=Number($('#new-day')?.value),time=$('#new-time')?.value;if(!who||!title){notice('Please enter the class and lesson title');return}state.extra.push({id:'extra'+Date.now(),week:state.week,day,time,end:'',who,title,tone:'purple',strands:'New draft',activities:[],objectives:['Add learning outcomes']});state.view='Week';closeOverlays();render();notice('Example lesson added to this preview');return}}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action);return}const lesson=e.target.closest('[data-open-lesson]');if(lesson){showLesson(lesson.dataset.openLesson);return}const day=e.target.closest('[data-add-day]');if(day){newLesson(Number(day.dataset.addDay));return}const tab=e.target.closest('[data-drawertab]');if(tab){showLesson(state.selected,tab.dataset.drawertab);return}const hubtab=e.target.closest('[data-hubtab]');if(hubtab){state.hubTab=hubtab.dataset.hubtab;state.filter='';state.hubDetail=null;render();return}const hub=e.target.closest('[data-hub]');if(hub){state.hubDetail=hub.dataset.hub;render();return}if(e.target.id==='scrim'){closeOverlays();return}if(e.target.id==='collapse'){ $('#app').classList.toggle('collapsed');return}});
document.addEventListener('change',e=>{if(e.target.id==='view-select'){state.view=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='cmd-input')paintSearch(e.target.value);if(e.target.id==='hub-search'){state.filter=e.target.value;const list=$('#hub-list');list.innerHTML=hubs.filter(x=>x.toLowerCase().includes(state.filter.toLowerCase())).map(x=>`<button class="hub-option" data-hub="${escapeHTML(x)}"><div><strong>${escapeHTML(x)}</strong><small>${x.startsWith('Greater Essex')?'Hub Lead Organisation: Essex Music Service':'East of England · Directory listing'}</small></div><span class="hub-green">Explore →</span></button>`).join('')||'<p style="font-size:11px">No matching Hubs.</p>'}if(e.target.id==='local-search'){$$('#local-results .listrow').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(e.target.value.toLowerCase())))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlays();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}});
render();
</script></body></html>
