<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCDesigner Planner · device preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: Inter, sans-serif; background: #E8F0EA; color: #002D24; }
    header { padding: 18px 28px 6px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
    h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 26px; }
    select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 10px; border: 1px solid #C9D6CD; }
    .row { display: flex; gap: 28px; align-items: flex-start; padding: 16px 28px 40px; }
    figure { margin: 0; }
    figcaption { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #374151; }
    .dev { background: #0b0f0e; padding: 10px; border-radius: 30px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); overflow: hidden; }
    .dev.phone { border-radius: 40px; }
    .clip { overflow: hidden; border-radius: 22px; background: #F3F6F3; }
    .phone .clip { border-radius: 32px; }
    iframe { border: 0; display: block; transform-origin: 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>Same Planner on tablet and phone</h1>
    <label>Screen <select id="pick">
      <option value="week">Week</option><option value="week-b">Week · time grid</option><option value="day">Day + lesson details</option>
      <option value="month">Month</option><option value="term">Term</option><option value="units">Units</option>
      <option value="classes">Organise classes</option><option value="copy">Reuse / move</option><option value="timetable">Timetable</option>
      <option value="feedback">Reflection</option><option value="export">Share &amp; print</option>
    </select></label>
  </header>
  <div class="row" id="row"></div>
  <script>
    const DEVICES = [
      ['iPad landscape · 1180 × 820', 1180, 820, 0.62, ''],
      ['iPad portrait · 820 × 1180', 820, 1180, 0.62, ''],
      ['iPhone · 390 × 844', 390, 844, 0.9, 'phone'],
    ];
    const pick = document.getElementById('pick');
    const q = new URLSearchParams(location.search).get('s');
    if (q) pick.value = q;
    function draw() {
      document.getElementById('row').innerHTML = DEVICES.map(([n, w, h, s, cls]) => `
        <figure><figcaption>${n}</figcaption>
          <div class="dev ${cls}"><div class="clip" style="width:${w * s}px;height:${h * s}px">
            <iframe src="index.html#${pick.value}" width="${w}" height="${h}" style="transform:scale(${s})"></iframe>
          </div></div></figure>`).join('');
    }
    pick.onchange = draw;
    draw();
  </script>
</body>
</html>
